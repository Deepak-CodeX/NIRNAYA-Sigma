[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nirnaya-decision-core"
version = "0.1.0"
description = "NIRNAYA AI Decision Intelligence Engine - Decision Core Foundation"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Antigravity Systems Engineering Team" }
]
keywords = ["decision-intelligence", "power-systems", "reproducible-optimization", "feasibility"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "pydantic>=2.6.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.4.0",
]

[tool.setuptools.packages.find]
where = ["services/decision-core"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
pythonpath = ["services/decision-core"]
